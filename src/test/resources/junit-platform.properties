junit.jupiter.execution.parallel.enabled=true

# Concurrency stays opt-in: only classes annotated with @Execution(CONCURRENT) fan out.
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread

# One thread per provider. A plain thread pool suits blocking HTTP calls better than
# ForkJoinPool's work-stealing, and it makes the parallelism below a hard cap.
junit.jupiter.execution.parallel.config.executor-service=WORKER_THREAD_POOL
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
